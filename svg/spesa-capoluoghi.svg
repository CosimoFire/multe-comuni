nt-weight="600" font-style="normal" fill="rgb(26, 26, 26)" letter-spacing="0">Quanto vincola alla sicurezza stradale</text><text x="16.0" y="322.3" font-family="&quot;Libre Franklin&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13px" font-weight="400" font-style="normal" fill="rgb(107, 107, 107)" letter-spacing="0">Come Milano divide i proventi delle multe nel 2025. Vincolato: 50% della voce A (minimo di legge 50%)</text><text x="36.0" y="581.3" font-family="&quot;Libre Franklin&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13px" font-weight="600" font-style="normal" fill="rgb(26, 26, 26)" letter-spacing="0">Come leggere i dati</text><text x="16.0" y="624.4" font-family="&quot;Libre Franklin&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-weight="400" font-style="normal" fill="rgb(107, 107, 107)" letter-spacing="0">Fonte: relazioni dei comuni al ministero dell'Interno (art. 142, comma 12-quater, Codice della strada), proventi 2024 e 2025; Istat,</text><text x="16.0" y="642.4" font-family="&quot;Libre Franklin&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-weight="400" font-style="normal" fill="rgb(107, 107, 107)" letter-spacing="0">residenti al 1° gennaio 2026</text><text x="16.0" y="662.4" font-family="&quot;Libre Franklin&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-weight="400" font-style="normal" fill="rgb(107, 107, 107)" letter-spacing="0">Elaborazione Radar – QN</text></g></svg>